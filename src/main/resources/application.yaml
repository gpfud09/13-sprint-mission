spring:
  application:
    name: discodeit

# PostgreSQL 연결
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

# ddl-auto: validate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# schema.sql 실행
  sql:
    init:
      mode: always

logging:
  level:
    com.sprintlog: debug

discodeit:
  repository:
    type: file